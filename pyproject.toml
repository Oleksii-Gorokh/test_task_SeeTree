[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "map-marker-editor"
version = "0.1.0"
description = "Mapbox marker editor with a small Python API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["map_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_api.py"]
pythonpath = ["src"]
markers = []
